name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import
        run: godot --headless --path . --editor --quit
      - name: Export
        run: godot --headless --path . --export-debug Android build/VB_LAST_EMPIRE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VB-LAST-EMPIRE-APK
          path: build/VB_LAST_EMPIRE.apk
          if-no-files-found: error
