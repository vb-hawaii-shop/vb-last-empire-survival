name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"
          log-accepted-android-sdk-licenses: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Keep prototype signing identity for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vb-prototype-debug-signing-v1
      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import
        run: godot --headless --path . --editor --quit
      - name: Gameplay checks
        run: godot --headless --path . --script tests/test_game.gd
      - name: Export
        run: godot --headless --path . --export-debug Android build/VB_LAST_EMPIRE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VB-LAST-EMPIRE-APK
          path: build/VB_LAST_EMPIRE.apk
          if-no-files-found: error
